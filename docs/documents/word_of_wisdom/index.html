  <script>
  (function() {
    'use strict';

    // Load taxonomy index and render tag clouds on homepage
    async function loadTaxonomyIndex() {
      try {
        const base = '/a_careful_examination';
        const response = await fetch(base + '/taxonomy_index.json');
        if (!response.ok) throw new Error('Failed to load taxonomy index');
        const data = await response.json();
        renderTagClouds(data);
      } catch (err) {
        console.error('Failed to load taxonomy index:', err);
      }
    }

    function renderTagClouds(data) {
      const base = '/a_careful_examination';
      
      // Render categories tag cloud
      const categoriesCloud = document.getElementById('tag-cloud-categories');
      if (categoriesCloud && data.categories) {
        categoriesCloud.innerHTML = data.categories.map(term => 
          '<a href="' + base + '/categories/' + term.slug + '/" class="tag-pill tag-category">' +
          escapeHtml(term.name) + (term.count ? ' <span class="tag-count">(' + term.count + ')</span>' : '') +
          '</a>'
        ).join('');
      }

      // Render tags tag cloud
      const tagsCloud = document.getElementById('tag-cloud-tags');
      if (tagsCloud && data.tags) {
        tagsCloud.innerHTML = data.tags.map(term => 
          '<a href="' + base + '/tags/' + term.slug + '/" class="tag-pill tag-tag">' +
          escapeHtml(term.name) + (term.count ? ' <span class="tag-count">(' + term.count + ')</span>' : '') +
          '</a>'
        ).join('');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Fix absolute links that don't have the base_url prefix
    function fixAbsoluteLinks() {
      const base = '/a_careful_examination';
      const links = document.querySelectorAll('a[href^="/"]:not([href^="/a_careful_examination/"])');
      links.forEach(link => {
        const href = link.getAttribute('href');
        if (href && href.startsWith('/') && !href.startsWith('/a_careful_examination/')) {
          link.setAttribute('href', base + href);
        }
      });
    }

    // Initialize on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        loadTaxonomyIndex();
        fixAbsoluteLinks();
      });
    } else {
      loadTaxonomyIndex();
      fixAbsoluteLinks();
    }
  })();
  </script>
